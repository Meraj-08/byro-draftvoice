<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DraftVoice Mock Feed</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="feed.css">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <span class="logo">in</span>
    <span class="nav-title">Mock feed</span>
    <span class="nav-note">Synthetic posts, plus public excerpts by Rico and Fathin. Nothing here is LinkedIn.</span>
  </div>
</header>

<div class="pick-banner" id="pickBanner" hidden>Click the post you want to draft for. <button id="pickCancel">Cancel</button></div>

<main class="feed" id="feed"></main>

<button class="edge-tab" id="edgeTab" aria-label="Open DraftVoice" aria-expanded="false">
  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12v9H8l-4 3z" fill="currentColor"/></svg>
  <span>DraftVoice</span>
</button>

<aside class="drawer" id="drawer" aria-label="DraftVoice" aria-hidden="true">
  <iframe id="panel" src="panel.html" title="DraftVoice review panel" allow="clipboard-write"></iframe>
</aside>

<script src="feed.js"></script>
</body>
</html>
